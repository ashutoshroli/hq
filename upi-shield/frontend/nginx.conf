server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 160m;  # APK uploads

    # Backend API (FastAPI). The /api prefix is stripped before forwarding.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    # Swagger UI (linked from Settings) loads its schema from the site root.
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: every unknown path serves the app shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
    }
}
