name: Backend CI

on:
  pull_request:
    paths:
      - "upi-shield/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "upi-shield/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: upi-shield/backend

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.8
      - run: ruff check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: upi-shield/backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Run test suite
        run: python -m pytest
      - name: Verify committed evaluation metrics are reproducible
        run: |
          python -m eval.evaluate
          git diff --exit-code -- eval/ || {
            echo "::error::Committed evaluation artifacts are stale. Run 'python -m eval.evaluate' and commit the result."
            exit 1
          }
      - name: Run campaign clustering demo
        run: python -m eval.campaign_demo

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t upi-shield-backend:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 upi-shield-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/eval/metrics | python -c "import json,sys; d=json.load(sys.stdin); assert d['is_placeholder'] is False, d"
          docker rm -f api
